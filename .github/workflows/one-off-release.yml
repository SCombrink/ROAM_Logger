name: Release v0.6.5 (one-off)

# One-off: builds what is on main and publishes it as the latest release,
# because tags cannot be pushed from the build session. The version tag is
# created on main's commit when the release is published.
# Temporary: removed once the release is live.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

concurrency:
  group: one-off-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit being released
        id: main
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ROAM Logger v__VERSION__"
          releaseCommitish: ${{ steps.main.outputs.sha }}
          releaseBody: "Auto-update will install this silently on next app launch. See commits since last release for changes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cat > notes.md <<'NOTES'
          What's new in this version:
          - Nudge crew members who are below 4 this month: Teams opens with a short message ready to send.
          - Share your crew list with others, and export your crew's monthly counts to Excel.
          - Finding colleagues works better for names with middle names or surnames like "du Plooy".

          The app updates itself the next time it is opened.
          NOTES
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false --latest --notes-file notes.md
          gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft,tagName,targetCommitish,url
