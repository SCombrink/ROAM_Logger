name: Delete v0.7.0 and v0.7.1 test drafts (one-off)

# One-off: removes the two unpublished test drafts. Only drafts with these
# exact tags are deleted. Temporary: removed once done.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

jobs:
  delete-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '.[] | select(.draft == true and (.tag_name == "v0.7.0" or .tag_name == "v0.7.1")) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            echo "Deleting draft $tag ($id)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          gh api "repos/${{ github.repository }}/releases?per_page=5" --jq '.[] | "\(.tag_name) draft=\(.draft)"'
