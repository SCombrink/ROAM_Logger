name: Publish draft v0.6.14 (one-off)

# One-off: publishes the tested v0.6.14 draft as the latest release, so the
# app's auto-update installs it. Temporary: removed once it is live.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

concurrency:
  group: one-off-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          What's new in this version:
          - Your monthly counts now come straight from January to December of this year, so a new month shows up right away.
          - The ROAM AI panel stays in place at the top while the form scrolls.
          - Find any colleague instantly: the app keeps a list of everyone in the company on your computer.
          - A new, easier time picker: type the time, or pick it with one click.
          - Fixed: a time like "2:30 PM" from ROAM AI is now logged as 14:30.

          The app updates itself the next time it is opened.
          NOTES
          gh release edit v0.6.14 --repo "${{ github.repository }}" --draft=false --latest --title "ROAM Logger v0.6.14" --notes-file notes.md
          gh release view v0.6.14 --repo "${{ github.repository }}" --json isDraft,tagName,url
