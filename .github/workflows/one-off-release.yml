name: Draft release v0.7.0 (one-off)

# One-off: builds this branch as a DRAFT release for testing. It is not
# published, so the app's auto-update does not see it (latest.json keeps
# pointing at the current public release). Temporary: removed once built.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

concurrency:
  group: one-off-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Commit being released
        id: main
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ROAM Logger v__VERSION__"
          releaseCommitish: ${{ steps.main.outputs.sha }}
          releaseBody: "Auto-update will install this silently on next app launch. See commits since last release for changes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Add notes (stays a draft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cat > notes.md <<'NOTES'
          DRAFT for testing - not published, so nobody is updated to it.

          - ROAM AI now runs on GitHub Copilot: sign in once with a free GitHub account, led by the app in a small window (code filled in).
          - ROAM AI's engine (GitHub Copilot CLI) installs itself in the background after the update.
          - Voice uses Windows voice typing.
          - A saved Gemini key still works as a fallback.
          NOTES
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --notes-file notes.md
          gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft,tagName,targetCommitish,url
