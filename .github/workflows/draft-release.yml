name: Release v0.6.0

# Builds the app from this branch, attaches it to the GitHub release named
# after the app version, then publishes that release as the latest one (the
# auto-updater reads releases/latest). Publishing creates the version tag.
# Temporary: remove this file once the release is live.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  build-draft:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build, sign and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ROAM Logger v__VERSION__"
          releaseCommitish: ${{ github.sha }}
          releaseBody: "Auto-update will install this silently on next app launch. See commits since last release for changes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cat > notes.md <<'NOTES'
          What's new in this version:
          - Monthly observation tracker: your observations for each month this year, with a target of 4 a month (red, orange, green) and a celebration when you reach 10.
          - Look up a colleague's monthly observations.
          - Refreshed design: chat box with built-in voice and send buttons, connection status icon, light / dark / system theme.
          - Messages now appear where you are looking, and missing fields are highlighted when you submit.

          The app updates itself the next time it is opened.
          NOTES
          gh release edit "v$VERSION" --repo "${{ github.repository }}" --draft=false --latest --notes-file notes.md
          gh release view "v$VERSION" --repo "${{ github.repository }}" --json isDraft,isLatest,tagName,url
