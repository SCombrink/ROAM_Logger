name: Draft release (v0.6.0)

# Builds the app from this branch on every push and attaches it to a DRAFT
# GitHub release named after the app version. Drafts are invisible to users
# and to the auto-updater (which reads releases/latest) until someone presses
# Publish on GitHub, which also creates the version tag.
# Remove this file once the draft has been published.
on:
  push:
    branches:
      - claude/gracious-brown-b2xmae

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: true

jobs:
  build-draft:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm install

      - name: Build, sign and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ROAM Logger v__VERSION__"
          releaseCommitish: ${{ github.sha }}
          releaseBody: "Auto-update will install this silently on next app launch. See commits since last release for changes."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
